[project]
name = "repro-core"
version = "0.1.0"
description = "Shared infrastructure for honest, scientific reproductions of ML papers (environment capture, benchmark protocol runner)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NabarunCode" }]
dependencies = []

[project.scripts]
repro-env = "repro_core.environment:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_core"]

# ---------------------------------------------------------------------------
# uv workspace: every paper's experiments/ directory is a member package.
# `uv sync --all-packages` installs shared infrastructure plus every paper.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["papers/*/experiments"]

# ---------------------------------------------------------------------------
# pytest — one invocation runs shared-infrastructure tests and every
# paper's tests. importlib import mode keeps per-paper test modules from
# colliding without requiring unique file names across 50 papers.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "papers/*/experiments/tests"]
addopts = "--import-mode=importlib --strict-markers -q"

# ---------------------------------------------------------------------------
# ruff — lint + format for the whole repository. The vendored reference
# implementation (a git submodule, third-party code) is never linted.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["papers/*/references/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

# ---------------------------------------------------------------------------
# mypy — strict on all first-party code; the reference submodule is Rust
# and excluded defensively in case it ever vendors Python helpers.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["papers/.*/references/.*"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
