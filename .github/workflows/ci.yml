name: CI

on:
  push:
  pull_request:

# The reference implementation submodule is intentionally NOT checked out:
# tests are self-contained (fixtures are committed first-party data), and
# CI must never silently depend on third-party code being present.

jobs:
  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace
        run: uv sync --all-packages --all-extras
      - name: Run all tests (shared infrastructure + every paper)
        run: uv run pytest
