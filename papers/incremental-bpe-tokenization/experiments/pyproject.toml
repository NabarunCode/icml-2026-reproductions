[project]
name = "incbpe"
version = "0.1.0"
description = "Independent Python reproduction of Incremental BPE Tokenization (Jiang & Gong, ICML 2026). Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NabarunCode" }]
dependencies = []

[project.optional-dependencies]
# Benchmark-only baselines (Claims 3-4): never required by incbpe itself.
bench = [
    "tiktoken>=0.8",
    "tokenizers>=0.20",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incbpe"]
